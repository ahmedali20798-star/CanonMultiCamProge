name: Verify & Build CanonMultiCam Pro

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Detekt, Unit Tests & Debug APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate or bootstrap Gradle Wrapper
        id: locate_gradle
        run: |
          set -e
          GRADLEW_FILE=$(find . -maxdepth 3 -name "gradlew" -print -quit)
          if [ -n "$GRADLEW_FILE" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_FILE")
            echo "Found existing gradlew in: $PROJECT_DIR"
          else
            echo "gradlew not found in repository; locating Android project root..."
            SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit)
            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            else
              PROJECT_DIR="."
            fi
            echo "Bootstrapping Gradle Wrapper in: $PROJECT_DIR"
            (cd "$PROJECT_DIR" && gradle wrapper --gradle-version 8.7)
          fi
          chmod +x "$PROJECT_DIR/gradlew"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-root-directory: ${{ steps.locate_gradle.outputs.project_dir }}

      - name: Run Detekt static analysis
        working-directory: ${{ steps.locate_gradle.outputs.project_dir }}
        run: ./gradlew detekt --stacktrace

      - name: Run Unit & Protocol Verification Tests
        working-directory: ${{ steps.locate_gradle.outputs.project_dir }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        working-directory: ${{ steps.locate_gradle.outputs.project_dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: ${{ steps.locate_gradle.outputs.project_dir }}/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CanonMultiCamPro-v3.0.0-debug
          path: ${{ steps.locate_gradle.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          retention-days: 14
